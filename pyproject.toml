[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-from-scratch"
version = "0.1.0"
description = "A small, understandable coding agent implemented without agent frameworks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
include = ["coding_agent*"]
